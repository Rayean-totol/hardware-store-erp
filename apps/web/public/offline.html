<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070d1a">
<title>Offline · Al Qureshi Hardware ERP Pro</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px;
    background: #070d1a; color: #e5e7eb; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 28rem; text-align: center; display: grid; gap: 14px; }
  h1 { font-size: 1.25rem; margin: 0; }
  p { margin: 0; line-height: 1.6; color: #9ca3af; }
  [lang="ar"] { font-family: "Noto Sans Arabic", system-ui, sans-serif; }
  button { min-height: 44px; border-radius: 8px; border: 0; padding: 0 18px; font-weight: 600;
    background: #f59e0b; color: #0b1220; cursor: pointer; }
  hr { border: 0; border-top: 1px solid #1f2937; width: 100%; }
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>The app needs an internet connection to load and to save anything. Nothing you have not already saved has been sent or lost.</p>
  <button type="button" onclick="location.reload()">Try again</button>
  <hr>
  <div lang="ar" dir="rtl">
    <h1>أنت غير متصل بالإنترنت</h1>
    <p>يحتاج التطبيق إلى اتصال بالإنترنت للتحميل وللحفظ. لم يُرسل أي شيء لم تحفظه، ولم يضع شيئاً.</p>
  </div>
</main>
</body>
</html>
